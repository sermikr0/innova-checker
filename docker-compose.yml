services:
  db:
    image: postgres:16-alpine
    container_name: innova-checker-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-innova}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-innova_checker}
    ports:
      # Bound to loopback only; change the host port if 5442 is taken.
      - "127.0.0.1:${POSTGRES_PORT:-5442}:5432"
    volumes:
      - innova_checker_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  innova_checker_pg:
